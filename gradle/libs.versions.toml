[versions]
appVersion = "1.0.3"

kotlin = "2.4.20"
agp = "9.4.1"
composeMultiplatform = "1.12.1"
# Compose Multiplatform material3 ships on its own version line
composeMaterial3 = "1.9.0"

android-compileSdk = "37"
# 사용자 지시로 Android 13 부터만 지원한다(docs/common/notification-widget.html). POST_NOTIFICATIONS 가 항상 필요하다.
android-minSdk = "33"
android-targetSdk = "37"

androidx-activityCompose = "1.13.0"
# 알림 위젯의 NotificationCompat 와 DecoratedCustomViewStyle. :core:widget 만 쓴다.
androidx-core = "1.19.0"
# 홈 화면 위젯. RemoteViews 를 Compose 문법으로 만든다. Compose UI 가 아니라 compose.runtime 만 요구한다.
androidx-glance = "1.2.0"

koin = "4.2.2"

# Compose Multiplatform 1.12.1 이 쓰는 androidx.compose.runtime 과 같은 버전 줄이어야 한다.
composeRuntimeRetain = "1.12.1"

androidx-lifecycle = "2.11.0"
# JetBrains 의 navigation3-ui 1.1.2 가 끌고 오는 androidx 런타임 버전에 맞춘다. 두 버전 줄은 번호가 다르다.
androidx-navigation3 = "1.1.7"
jetbrains-navigation3 = "1.1.2"

kotlinx-browser = "0.5.0"
kotlinx-coroutines = "1.11.0"
kotlinx-serialization = "1.11.0"

# DataStore 는 okio 저장소까지 다섯 타깃을 퍼블리시한다. 버린 Room3 은 docs/common/terminal-panels.html#implementation 에 있다.
androidx-datastore = "1.2.1"

# scrcpy-server 로 받은 H.264 기기 화면을 디코딩한다(docs/common/device-mirroring.html).
# 네이티브는 데스크톱이 지원하는 macOS 두 아키텍처만 넣는다.
bytedeco-ffmpeg = "8.1.2-1.5.14"
bytedeco-javacpp = "1.5.14"

pty4j = "0.13.13"
# 앱 안 브라우저(JVM)의 Chromium 엔진. 버린 후보는 docs/platform/jvm.html#terminal-browser 에 있다.
# 네이티브의 버전 문자열은 jcefmaven 이 가리키는 jcef-api 의 버전과 같아야 한다.
jcefmaven = "146.0.10"
jcef-natives = "jcef-d3de827+cef-146.0.10+g8219561+chromium-146.0.7680.179"
composeWebView = "1.0.0-beta-02"

[libraries]
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }

koin-core = { module = "io.insert-koin:koin-core", version.ref = "koin" }
koin-compose = { module = "io.insert-koin:koin-compose", version.ref = "koin" }
koin-compose-viewmodel = { module = "io.insert-koin:koin-compose-viewmodel", version.ref = "koin" }
koin-compose-navigation3 = { module = "io.insert-koin:koin-compose-navigation3", version.ref = "koin" }

# ViewModel 과 Navigation3 는 JetBrains 가 skiko 타깃까지 퍼블리시하는 쪽을 쓴다.
androidx-lifecycle-runtime-compose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-runtime-compose", version.ref = "androidx-lifecycle" }
androidx-lifecycle-viewmodel-compose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "androidx-lifecycle" }
androidx-lifecycle-viewmodel-navigation3 = { module = "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel-navigation3", version.ref = "androidx-lifecycle" }
androidx-navigation3-ui = { module = "org.jetbrains.androidx.navigation3:navigation3-ui", version.ref = "jetbrains-navigation3" }
# 런타임은 androidx 가 직접 KMP 로 퍼블리시한다. JetBrains 쪽에는 -ui 만 있다.
androidx-navigation3-runtime = { module = "androidx.navigation3:navigation3-runtime", version.ref = "androidx-navigation3" }

# retain 은 runtime 이 아니라 별도 아티팩트다.
compose-runtime-retain = { module = "androidx.compose.runtime:runtime-retain", version.ref = "composeRuntimeRetain" }

kotlinx-browser = { module = "org.jetbrains.kotlinx:kotlinx-browser", version.ref = "kotlinx-browser" }

kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinx-coroutines" }
# JVM 에서 Dispatchers.Main 을 제공한다. Compose Desktop 은 이것을 데려오지 않아서 :shared 가 직접 넣는다.
kotlinx-coroutines-swing = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-swing", version.ref = "kotlinx-coroutines" }

kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }

androidx-datastore-core-okio = { module = "androidx.datastore:datastore-core-okio", version.ref = "androidx-datastore" }

bytedeco-ffmpeg = { module = "org.bytedeco:ffmpeg", version.ref = "bytedeco-ffmpeg" }
bytedeco-javacpp = { module = "org.bytedeco:javacpp", version.ref = "bytedeco-javacpp" }

pty4j = { module = "org.jetbrains.pty4j:pty4j", version.ref = "pty4j" }
jcefmaven = { module = "me.friwi:jcefmaven", version.ref = "jcefmaven" }
jcef-natives-macosx-arm64 = { module = "me.friwi:jcef-natives-macosx-arm64", version.ref = "jcef-natives" }
compose-webview = { module = "io.github.kdroidfilter:composewebview", version.ref = "composeWebView" }

compose-runtime = { module = "org.jetbrains.compose.runtime:runtime", version.ref = "composeMultiplatform" }
compose-foundation = { module = "org.jetbrains.compose.foundation:foundation", version.ref = "composeMultiplatform" }
compose-material3 = { module = "org.jetbrains.compose.material3:material3", version.ref = "composeMaterial3" }
compose-ui = { module = "org.jetbrains.compose.ui:ui", version.ref = "composeMultiplatform" }
compose-ui-test = { module = "org.jetbrains.compose.ui:ui-test", version.ref = "composeMultiplatform" }
compose-components-resources = { module = "org.jetbrains.compose.components:components-resources", version.ref = "composeMultiplatform" }
compose-ui-toolingPreview = { module = "org.jetbrains.compose.ui:ui-tooling-preview", version.ref = "composeMultiplatform" }

androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activityCompose" }
androidx-glance-appwidget = { module = "androidx.glance:glance-appwidget", version.ref = "androidx-glance" }
androidx-core = { module = "androidx.core:core", version.ref = "androidx-core" }
# ProcessLifecycleOwner. JetBrains lifecycle 2.11.0 이 Android 에서 쓰는 androidx 아티팩트와 같은 버전 줄이다.
androidx-lifecycle-process = { module = "androidx.lifecycle:lifecycle-process", version.ref = "androidx-lifecycle" }

# build-logic 의 컨벤션 플러그인이 쓰는 플러그인 마커. plugins { } 로 적용하려면 컴파일
# 클래스패스에 있어야 해서 라이브러리로도 선언한다.
plugin-kotlin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
plugin-android = { module = "com.android.tools.build:gradle", version.ref = "agp" }
plugin-compose = { module = "org.jetbrains.compose:compose-gradle-plugin", version.ref = "composeMultiplatform" }
plugin-composeCompiler = { module = "org.jetbrains.kotlin:compose-compiler-gradle-plugin", version.ref = "kotlin" }

[plugins]
kotlinMultiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlinJvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
composeCompiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlinSerialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
composeMultiplatform = { id = "org.jetbrains.compose", version.ref = "composeMultiplatform" }
androidApplication = { id = "com.android.application", version.ref = "agp" }
androidLibrary = { id = "com.android.library", version.ref = "agp" }
androidKotlinMultiplatformLibrary = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
