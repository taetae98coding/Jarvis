org.gradle.jvmargs=-Xmx4096M -Dfile.encoding=UTF-8 -XX:+UseParallelGC
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.parallel=true

kotlin.code.style=official
# 모듈 16개가 링크되는 wasmJs 테스트 실행 바이너리가 3G 에서 GC overhead limit 으로 죽었다.
kotlin.daemon.jvmargs=-Xmx6144M
# iOS release 링크(LTO)는 Gradle 데몬 힙(4 GB)을 다른 태스크와 나눠 쓰면 OutOfMemoryError 로 죽는다. Kotlin/Native
# 컴파일러는 기본값으로 데몬 안에서 돌아 kotlin.native.jvmArgs 가 먹지 않으므로, 별도 프로세스로 띄워 12 GB 를 준다.
kotlin.native.disableCompilerDaemon=true
kotlin.native.jvmArgs=-Xmx12g

android.useAndroidX=true
android.nonTransitiveRClass=true
