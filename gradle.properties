org.gradle.jvmargs=-Xmx4096M -Dfile.encoding=UTF-8 -XX:+UseParallelGC
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.parallel=true

kotlin.code.style=official
# 모듈 16개가 링크되는 wasmJs 테스트 실행 바이너리가 3G 에서 GC overhead limit 으로 죽었다.
kotlin.daemon.jvmargs=-Xmx6144M
# Kotlin/Native 컴파일러는 Gradle 데몬과 별도 프로세스로 돌아 org.gradle.jvmargs 를 받지 않는다.
# iOS release 링크(LTO)가 기본 힙에서 OutOfMemoryError 로 죽는다.
kotlin.native.jvmArgs=-Xmx12g

android.useAndroidX=true
android.nonTransitiveRClass=true
